<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .timestamp {
            font-size: 0.9em;
            opacity: 0.9;
            font-style: italic;
        }

        .content {
            padding: 40px;
        }

        .summary-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }

        .summary-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .summary-section > p {
            font-size: 1.1em;
            margin-bottom: 20px;
            color: #555;
        }

        .summary-section h3 {
            color: #764ba2;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .stat-card {
            display: inline-block;
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin: 10px;
            min-width: 200px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .stat-card h4 {
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card p {
            color: #555;
            margin: 8px 0;
            font-size: 0.95em;
        }

        .stat-card p strong {
            color: #333;
        }

        .data-section {
            margin-top: 30px;
        }

        .data-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        th {
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            color: #555;
        }

        tbody tr {
            transition: background-color 0.2s;
        }

        tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tbody tr:hover {
            background-color: #e3f2fd;
            cursor: pointer;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #777;
            font-size: 0.9em;
            border-top: 1px solid #e0e0e0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            header {
                padding: 30px 20px;
            }

            header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 20px;
            }

            .summary-section {
                padding: 20px;
            }

            .stat-card {
                display: block;
                margin: 10px 0;
                width: 100%;
            }

            .table-wrapper {
                border-radius: 0;
            }

            table {
                font-size: 0.9em;
            }

            th, td {
                padding: 10px 8px;
            }
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                border-radius: 0;
            }

            header {
                background: #667eea;
                color: white;
            }

            .stat-card {
                break-inside: avoid;
                box-shadow: none;
                border: 1px solid #ddd;
            }

            table {
                page-break-inside: avoid;
            }

            tbody tr:hover {
                background-color: transparent;
            }

            footer {
                page-break-before: avoid;
            }
        }

        /* Dark Mode Support */
        @media (prefers-color-scheme: dark) {
            body {
                background: #1a1a1a;
            }

            .container {
                background: #2d2d2d;
            }

            .content {
                color: #e0e0e0;
            }

            .summary-section {
                background: #3a3a3a;
            }

            .summary-section h2,
            .data-section h2 {
                color: #9fa8da;
            }

            .stat-card {
                background: #3a3a3a;
                color: #e0e0e0;
            }

            .stat-card h4 {
                color: #9fa8da;
            }

            .stat-card p {
                color: #b0b0b0;
            }

            table {
                background: #2d2d2d;
            }

            td {
                color: #b0b0b0;
                border-bottom-color: #444;
            }

            tbody tr:nth-child(even) {
                background-color: #3a3a3a;
            }

            tbody tr:hover {
                background-color: #4a4a4a;
            }

            footer {
                background: #3a3a3a;
                color: #999;
                border-top-color: #444;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>{{TITLE}}</h1>
            <div class="timestamp">Generated: {{TIMESTAMP}}</div>
        </header>

        <div class="content">
            <div class="summary-section">
                <h2>Summary</h2>
                {{SUMMARY}}
            </div>

            <div class="data-section">
                <h2>Data</h2>
                <div class="table-wrapper">
                    {{DATA}}
                </div>
            </div>
        </div>

        <footer>
            <p>Report generated by Report Generator Skill</p>
        </footer>
    </div>
</body>
</html>
