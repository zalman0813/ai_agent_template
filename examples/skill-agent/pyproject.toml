[project]
name = "skill-agent-poc"
version = "0.1.0"
description = "POC demonstrating Deep Agents SDK with SkillsMiddleware and FilesystemBackend"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.2.8",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.28",
    "ddgs>=9.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
pdf = [
    "pypdf>=4.0.0",
    "markdown2>=2.4.0",
    "weasyprint>=60.0",
]
data = [
    "pandas>=2.0.0",
]
all = [
    "pypdf>=4.0.0",
    "markdown2>=2.4.0",
    "weasyprint>=60.0",
    "pandas>=2.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
